name: find_my_job_flutter
description: >-
  App Flutter multipiattaforma per cercare lavoro con candidatura 1-Click,
  CV Cloud su Firestore (findmyjob-510711), mappa interattiva delle offerte
  nelle vicinanze, gestionale ATS per recruiter, colloqui Google Meet con
  invio email automatico tramite Gmail, notifiche push e feedback post-colloquio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase & Cloud Firestore (Project ID: findmyjob-510711)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  # Google OAuth & Workspace APIs (Google Meet & Gmail)
  google_sign_in: ^6.2.1
  http: ^1.2.2
  # Mappa Interattiva & Geolocalizzazione
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  # Caricamento CV Ad-Hoc & Utilità
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
